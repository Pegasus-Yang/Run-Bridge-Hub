[project]
name = "runbridge-hub"
version = "0.9.2"
description = "RunBridge 远程浏览器网关：HTTP/MCP 接入、节点租约与会话路由"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/runbridge_hub/web/icons/LICENSE"]
authors = [{ name = "Pegasus-Yang", email = "panesas2@gmail.com" }]
keywords = ["runbridge", "browser-automation", "playwright", "mcp", "remote-browser"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "packaging>=25",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.35,<1",
    "websockets>=15,<18",
]

[project.urls]
Homepage = "https://github.com/Pegasus-Yang/Run-Bridge-Hub"
Documentation = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/blob/main/doc/README.md"
Repository = "https://github.com/Pegasus-Yang/Run-Bridge-Hub.git"
Issues = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/issues"

[project.scripts]
runbridge-hub = "runbridge_hub.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: 需要显式启用的真实受管理浏览器联调"]

[[tool.uv.index]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.sdist]
exclude = ["/doc/reference/DSH扩展修复核验记录.json", "/doc/reference/构建产物核验记录.json", "/doc/reference/文档核验记录.json", "/doc/reference/R4构建产物核验记录.json", "/doc/reference/R4文档核验记录.json", "/doc/reference/画面流构建产物核验记录.json", "/doc/reference/画面流文档核验记录.json"]
