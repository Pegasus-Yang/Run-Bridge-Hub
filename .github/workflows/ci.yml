name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 验证与打包
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ github.ref }}
