[project]
name = "runbridge-hub"
version = "0.9.3"
description = "Remote browser gateway with HTTP/MCP access, exclusive Node leases, and session routing"
readme = { file = "README.en.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE", "src/runbridge_hub/web/icons/LICENSE"]
authors = [{ name = "Pegasus-Yang", email = "panesas2@gmail.com" }]
keywords = ["runbridge", "browser-automation", "playwright", "mcp", "remote-browser"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "packaging>=25",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.35,<1",
    "websockets>=15,<18",
]

[project.urls]
Homepage = "https://github.com/Pegasus-Yang/Run-Bridge-Hub"
Documentation = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/blob/main/doc/README.en.md"
"Chinese Documentation" = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/blob/main/doc/README.md"
Repository = "https://github.com/Pegasus-Yang/Run-Bridge-Hub"
Issues = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/issues"
Changelog = "https://github.com/Pegasus-Yang/Run-Bridge-Hub/blob/main/doc/project/版本发布记录.md"

[project.scripts]
runbridge-hub = "runbridge_hub.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: 需要显式启用的真实受管理浏览器联调"]

[[tool.uv.index]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/runbridge_hub"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/README.md", "/README.en.md", "/LICENSE",
    "/CONTRIBUTING.md", "/CONTRIBUTING.en.md", "/AGENTS.md", "/.gitignore",
    "/pyproject.toml", "/uv.lock", "/doc/README.md", "/doc/README.en.md",
    "/doc/user-guide", "/doc/deployment", "/doc/reference",
    "/doc/architecture", "/doc/development",
    "/doc/project/版本发布记录.md", "/doc/project/GitHub展示配置.md",
]
exclude = ["/doc/reference/*.json", "/doc/reference/*.png"]
